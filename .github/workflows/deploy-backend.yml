name: Ativar backend Manolo (Cloudflare)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ativar-backend-manolo
  cancel-in-progress: false

jobs:
  instalar:
    name: Preparar banco, IA e conectar chat
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: true
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar segredos Cloudflare
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Cadastre CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_API_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Instalar ferramentas
        run: npm install --no-audit --no-fund
      - name: Testar aplicação e instalador
        run: |
          npm test
          python -m unittest discover -s tests -p '*test.py' -v
      - name: Localizar ou criar D1
        run: node scripts/cloudflare_setup.mjs
      - name: Aplicar migrações D1
        run: npx wrangler d1 migrations apply manolo-db --remote
      - name: Importar resumos iniciais sem sobrescrever artigos completos
        run: npx wrangler d1 execute manolo-db --remote --file data/seed.sql --yes
      - name: Importar os 1.544 vídeos Mayhem
        shell: bash
        run: |
          set -euo pipefail
          for file in imports/videos_*.sql; do
            echo "Importando $file"
            npx wrangler d1 execute manolo-db --remote --file "$file" --yes
          done
      - name: Publicar backend com Gemma 4
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/manolo-deploy.log"
      - name: Configurar segredo interno se necessário
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list > "$RUNNER_TEMP/manolo-secrets.json"
          if node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.exit(data.some(x=>x.name==='ACCESS_SALT')?0:1)" "$RUNNER_TEMP/manolo-secrets.json"; then
            echo "ACCESS_SALT existente: mantido."
          else
            node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))" | npx wrangler secret put ACCESS_SALT
            echo "ACCESS_SALT criado na Cloudflare."
          fi
      - name: Validar API e preparar ligação com Pages
        run: node scripts/finalize_backend.mjs "$RUNNER_TEMP/manolo-deploy.log"
      - name: Atualizar a URL pública no repositório
        shell: bash
        run: |
          set -euo pipefail
          git restore wrangler.jsonc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/config.js
          if git diff --cached --quiet; then
            echo "A URL pública já estava configurada."
          else
            git commit -m "chore: conectar GitHub Pages ao backend Manolo"
            git push origin HEAD:main
          fi
      - name: Acionar publicação no GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh workflow run deploy-pages.yml --ref main; then
            echo "::warning::Execute Publicar Manolo no GitHub Pages manualmente."
          fi
          echo "Backend instalado. Confira também a execução de Publicar Manolo no GitHub Pages."
