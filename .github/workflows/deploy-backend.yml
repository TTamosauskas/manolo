name: Ativar backend Manolo (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/worker.js'
      - 'wrangler.jsonc'

permissions:
  contents: write
  actions: write

concurrency:
  group: ativar-backend-manolo
  cancel-in-progress: false

jobs:
  instalar:
    name: Preparar banco, IA e conectar chat
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: true
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar segredos Cloudflare
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Cadastre CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_API_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Instalar ferramentas
        run: npm install --no-audit --no-fund
      - name: Testar aplicação e instalador
        run: |
          npm test
          python -m unittest discover -s tests -p '*test.py' -v
      - name: Localizar ou criar D1
        run: node scripts/cloudflare_setup.mjs
      - name: Aplicar migrações D1
        run: npx wrangler d1 migrations apply manolo-db --remote
      - name: Importar resumos iniciais sem sobrescrever artigos completos
        run: npx wrangler d1 execute manolo-db --remote --file data/seed.sql --yes
      - name: Importar os 1.544 vídeos Mayhem
        shell: bash
        run: |
          set -euo pipefail
          for file in imports/videos_*.sql; do
            echo "Importando $file"
            npx wrangler d1 execute manolo-db --remote --file "$file" --yes
          done
      - name: Publicar backend com Gemma 4
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/manolo-deploy.log"
      - name: Configurar segredo interno se necessário
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list > "$RUNNER_TEMP/manolo-secrets.json"
          if node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.exit(data.some(x=>x.name==='ACCESS_SALT')?0:1)" "$RUNNER_TEMP/manolo-secrets.json"; then
            echo "ACCESS_SALT existente: mantido."
          else
            node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))" | npx wrangler secret put ACCESS_SALT
            echo "ACCESS_SALT criado na Cloudflare."
          fi
      - name: Validar API e preparar ligação com Pages
        run: node scripts/finalize_backend.mjs "$RUNNER_TEMP/manolo-deploy.log"
      - name: Validar entrevista e explicação de IA reais após deploy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url=(await import('./scripts/finalize_backend.mjs')).workerUrlFromLog((await import('node:fs')).readFileSync(process.env.RUNNER_TEMP+'/manolo-deploy.log','utf8'))+'/api/chat';
          async function chat(payload){
            const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json','origin':'https://ttamosauskas.github.io'},body:JSON.stringify(payload),signal:AbortSignal.timeout(45000)});
            let data;try{data=await response.json()}catch{data={error:'Corpo não é JSON'}}
            console.log(JSON.stringify({action:payload.action||'message',status:response.status,mode:data.mode,message:(data.message||'').slice(0,190),error:data.error||null,sources:data.sources?.length||0}));
            if(response.status!==200||data.error)throw new Error('API retornou erro no modo '+(payload.action||'mensagem'));
            return data;
          }
          const interview=await chat({action:'interviews'});
          const video=await chat({sessionId:interview.sessionId,message:'alquimia'});
          if(!video.message?.includes('youtube.com'))throw new Error('Catálogo D1 não encontrou vídeos de alquimia');
          const teach=await chat({action:'teach'});
          const answer=await chat({sessionId:teach.sessionId,message:'hermetismo'});
          const explanation=(answer.message||'').split('Pesquisei no acervo de **mortesubita.net**.').pop().split('**Fontes —').shift().trim();
          if(!answer.sources?.length||explanation.length<40)throw new Error('Gemma 4 retornou explicação vazia ou sem fontes');
          const demiurgo=await chat({message:'Quem é o Demiurgo?'});
          if(!demiurgo.sources?.some(s=>/demiurgo/i.test(s.url))||!demiurgo.message?.includes('Fontes — mortesubita.net'))throw new Error('Busca ao vivo do WordPress não encontrou/citou artigo sobre Demiurgo');
          console.log('Demiurgo: artigo do WordPress recuperado e resposta com fonte.');
          console.log('Fluxo D1 + Gemma 4 respondeu corretamente.');
          NODE
      - name: Atualizar a URL pública no repositório
        shell: bash
        run: |
          set -euo pipefail
          git restore wrangler.jsonc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/config.js
          if git diff --cached --quiet; then
            echo "A URL pública já estava configurada."
          else
            git commit -m "chore: conectar GitHub Pages ao backend Manolo"
            git push origin HEAD:main
          fi
      - name: Acionar publicação no GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh workflow run deploy-pages.yml --ref main; then
            echo "::warning::Execute Publicar Manolo no GitHub Pages manualmente."
          fi
          echo "Backend instalado. Confira também a execução de Publicar Manolo no GitHub Pages."
