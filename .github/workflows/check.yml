name: Verificar Manolo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Testar backend e instalação sem acessar a Cloudflare
        run: npm test
      - name: Testar extrator de artigos
        run: python -m unittest discover -s tests -p '*test.py' -v
      - name: Validar importação SQL repetida
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          db=sqlite3.connect(':memory:')
          db.executescript(Path('migrations/0001_init.sql').read_text())
          sql=Path('data/seed.sql').read_text()
          db.executescript(sql)
          db.executescript(sql)
          assert db.execute('SELECT count(*) FROM article_chunks').fetchone()[0]==10
          for p in sorted(Path('imports').glob('videos_*.sql')):
              db.executescript(p.read_text())
          assert db.execute('SELECT count(*) FROM videos').fetchone()[0]==1544
          assert db.execute("SELECT count(*) FROM video_fts WHERE video_fts MATCH 'alquimia'").fetchone()[0]>0
          print('SQL, catálogo e reimportação validados')
          PY
      - name: Diagnosticar preflight HTTPS publico do Worker (sem segredos)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://manolo.mvividvs.workers.dev';
          const cases=[
            ['/api/health',{method:'GET'}],
            ['/api/chat',{method:'OPTIONS',headers:{Origin:'https://ttamosauskas.github.io','Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'}}],
            ['/api/chat',{method:'OPTIONS'}],
            ['/api/chat',{method:'GET',headers:{Origin:'https://ttamosauskas.github.io'}}],
          ];
          for(const [path,config] of cases){
            try{
              const response=await fetch(base+path,{...config,signal:AbortSignal.timeout(12000)});
              const allowed=response.headers.get('access-control-allow-origin');
              const methods=response.headers.get('access-control-allow-methods');
              const type=response.headers.get('content-type');
              const text=(await response.text()).slice(0,500);
              console.log(JSON.stringify({path,method:config.method,status:response.status,allowOrigin:allowed,allowMethods:methods,contentType:type,body:text}));
            }catch(e){console.log(JSON.stringify({path,error:String(e)}));}
          }
          NODE
      - name: Validar Surpreenda-me com artigo público e resposta real
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://manolo.mvividvs.workers.dev/api/chat';
          const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Origin':'https://ttamosauskas.github.io'},body:JSON.stringify({action:'surprise'}),signal:AbortSignal.timeout(45000)});
          const data=await response.json();
          const source=data.sources?.[0];
          const valid=source&&new URL(source.url).hostname==='mortesubita.net';
          const generated=(data.message||'').split('**Fontes — mortesubita.net:**')[0];
          console.log(JSON.stringify({status:response.status,mode:data.mode,sources:data.sources?.length||0,sourceTitle:source?.title,sourceUrl:source?.url,textLength:generated.length}));
          if(!response.ok||!valid||!data.message?.includes('Surpreenda-me:')||generated.length<110)
            throw new Error('Surpreenda-me não retornou texto gerado com fonte válida');
          console.log('Surpreenda-me validado com IA real e artigo público.');
          NODE
