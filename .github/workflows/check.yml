name: Verificar Manolo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Testar backend e instalação sem acessar a Cloudflare
        run: npm test
      - name: Testar extrator de artigos
        run: python -m unittest discover -s tests -p '*test.py' -v
      - name: Validar importação SQL repetida
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          db=sqlite3.connect(':memory:')
          db.executescript(Path('migrations/0001_init.sql').read_text())
          sql=Path('data/seed.sql').read_text()
          db.executescript(sql)
          db.executescript(sql)
          assert db.execute('SELECT count(*) FROM article_chunks').fetchone()[0]==10
          for p in sorted(Path('imports').glob('videos_*.sql')):
              db.executescript(p.read_text())
          assert db.execute('SELECT count(*) FROM videos').fetchone()[0]==1544
          assert db.execute("SELECT count(*) FROM video_fts WHERE video_fts MATCH 'alquimia'").fetchone()[0]>0
          print('SQL, catálogo e reimportação validados')
          PY
      - name: Diagnosticar preflight HTTPS publico do Worker (sem segredos)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://manolo.mvividvs.workers.dev';
          const cases=[
            ['/api/health',{method:'GET'}],
            ['/api/chat',{method:'OPTIONS',headers:{Origin:'https://ttamosauskas.github.io','Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'}}],
            ['/api/chat',{method:'OPTIONS'}],
            ['/api/chat',{method:'GET',headers:{Origin:'https://ttamosauskas.github.io'}}],
          ];
          for(const [path,config] of cases){
            try{
              const response=await fetch(base+path,{...config,signal:AbortSignal.timeout(12000)});
              const allowed=response.headers.get('access-control-allow-origin');
              const methods=response.headers.get('access-control-allow-methods');
              const type=response.headers.get('content-type');
              const text=(await response.text()).slice(0,500);
              console.log(JSON.stringify({path,method:config.method,status:response.status,allowOrigin:allowed,allowMethods:methods,contentType:type,body:text}));
            }catch(e){console.log(JSON.stringify({path,error:String(e)}));}
          }
          NODE
      - name: Testar catálogo e uma resposta de IA do Worker publicado
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://manolo.mvividvs.workers.dev/api/chat';
          async function chat(payload){
            const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json','origin':'https://ttamosauskas.github.io'},body:JSON.stringify(payload),signal:AbortSignal.timeout(45000)});
            let data;try{data=await response.json()}catch{data={error:'Corpo não é JSON'}}
            console.log(JSON.stringify({action:payload.action||'message',status:response.status,mode:data.mode,message:(data.message||'').slice(0,190),error:data.error||null,sources:data.sources?.length||0}));
            if(response.status!==200||data.error)throw new Error('API retornou erro no modo '+(payload.action||'mensagem'));
            return data;
          }
          const interview=await chat({action:'interviews'});
          const video=await chat({sessionId:interview.sessionId,message:'alquimia'});
          if(!video.message?.includes('youtube.com'))throw new Error('Catálogo D1 não encontrou vídeos de alquimia');
          const teach=await chat({action:'teach'});
          const answer=await chat({sessionId:teach.sessionId,message:'hermetismo'});
          if(!answer.message?.includes('mortesubita.net'))throw new Error('Resposta didática não citou a origem dos artigos');
          console.log('Fluxo D1 + Gemma 4 respondeu corretamente.');
          NODE
