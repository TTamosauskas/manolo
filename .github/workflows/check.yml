name: Verificar Manolo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Testar backend e instalação sem acessar a Cloudflare
        run: npm test
      - name: Testar extrator de artigos
        run: python -m unittest discover -s tests -p '*test.py' -v
      - name: Validar importação SQL repetida
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          db=sqlite3.connect(':memory:')
          db.executescript(Path('migrations/0001_init.sql').read_text())
          sql=Path('data/seed.sql').read_text()
          db.executescript(sql)
          db.executescript(sql)
          assert db.execute('SELECT count(*) FROM article_chunks').fetchone()[0]==10
          for p in sorted(Path('imports').glob('videos_*.sql')):
              db.executescript(p.read_text())
          assert db.execute('SELECT count(*) FROM videos').fetchone()[0]==1544
          assert db.execute("SELECT count(*) FROM video_fts WHERE video_fts MATCH 'alquimia'").fetchone()[0]>0
          print('SQL, catálogo e reimportação validados')
          PY
      - name: Diagnosticar preflight HTTPS publico do Worker (sem segredos)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://manolo.mvividvs.workers.dev';
          const cases=[
            ['/api/health',{method:'GET'}],
            ['/api/chat',{method:'OPTIONS',headers:{Origin:'https://ttamosauskas.github.io','Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'}}],
            ['/api/chat',{method:'OPTIONS'}],
            ['/api/chat',{method:'GET',headers:{Origin:'https://ttamosauskas.github.io'}}],
          ];
          for(const [path,config] of cases){
            try{
              const response=await fetch(base+path,{...config,signal:AbortSignal.timeout(12000)});
              const allowed=response.headers.get('access-control-allow-origin');
              const methods=response.headers.get('access-control-allow-methods');
              const type=response.headers.get('content-type');
              const text=(await response.text()).slice(0,500);
              console.log(JSON.stringify({path,method:config.method,status:response.status,allowOrigin:allowed,allowMethods:methods,contentType:type,body:text}));
            }catch(e){console.log(JSON.stringify({path,error:String(e)}));}
          }
          NODE
      - name: Verificar busca pública permitida do Morte Súbita (somente diagnóstico)
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse, urllib.robotparser
          import json
          host='https://mortesubita.net'
          ua='ManoloResearchBot/1.0 (+https://github.com/TTamosauskas/manolo; respects robots.txt)'
          robots=urllib.robotparser.RobotFileParser()
          try:
              req=urllib.request.Request(host+'/robots.txt',headers={'User-Agent':ua})
              with urllib.request.urlopen(req,timeout=12) as r:
                  data=r.read(25000).decode('utf-8','replace')
                  print('robots status',r.status,'bytes',len(data));print('robots directives',data[:1800])
              robots.parse(data.splitlines())
          except Exception as e:
              print('robots unavailable',type(e).__name__,str(e)[:200])
              raise SystemExit(0)
          paths=['/wp-json/wp/v2/search?search=demiurgo&per_page=3','/wp-json/wp/v2/posts?search=demiurgo&per_page=3&_fields=link,title,content,excerpt','/?s=demiurgo','/a-origem-e-a-evolucao-do-demiurgo/']
          for path in paths:
              u=host+path
              if not robots.can_fetch(ua,u):
                  print('ROBOTS DISALLOWED',path);continue
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':ua,'Accept':'application/json,text/html;q=0.8'})
                  with urllib.request.urlopen(req,timeout=18) as r:
                      content=r.read(150000)
                      print('FETCH',path,'status',r.status,'ctype',r.headers.get('content-type'),'bytes',len(content),'final',r.url)
                      if 'json' in (r.headers.get('content-type') or ''):
                          parsed=json.loads(content)
                          print('JSON',str([{k:v for k,v in x.items() if k in ('id','title','url','link')} for x in parsed[:3]])[:1000] if isinstance(parsed,list) else str(parsed)[:300])
                      else:
                          print('HTML title',content[:180].decode('utf-8','replace'))
              except Exception as e: print('FETCH ERROR',path,type(e).__name__,str(e)[:180])
          PY
